# ============================================================
# Amana Aktien – Auto-Update YouTube Videos (v3)
# ============================================================
# Läuft alle 2 Stunden. Thumbnails werden LOKAL gespeichert.
# ============================================================

name: 🕌 Auto-Update Videos

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# ── Race Conditions verhindern ──
concurrency:
  group: amana-video-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 📦 Install Dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: 🔍 Debug Info
        run: |
          echo "Python: $(python --version)"
          echo "Pip packages: $(pip list --format=columns | head -10)"
          git status

      - name: 🎬 Update Videos from YouTube RSS
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python update_videos.py

      - name: 💾 Commit & Push
        run: |
          git config --local user.email "bot@amanaaktien.github.io"
          git config --local user.name "Amana Aktien Bot"

          # JSON + Thumbnails stagen
          git add videos.json
          git add img/thumbnails/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "ℹ️ Keine Änderungen – kein Commit."
          else
            git commit -m "🕌 Auto-Update: Neue Halal-Videos [skip ci]"
            # Sicherer Push ohne rebase-Risiko
            git fetch origin main
            git rebase origin/main
            git push origin main
            echo "✅ Erfolgreich gepusht!"
          fi
