name: 🕌 Auto-Update Videos

on:
  schedule:
    - cron: '0 */2 * * *'  # Alle 2 Stunden automatisch
  workflow_dispatch:     # Erlaubt dir, es manuell zu starten

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: pip install requests python-dateutil

      - name: 🎬 Run Update Script
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python update_videos.py

      - name: 💾 Save Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Amana Aktien Bot"
          git add videos.json
          if git diff --staged --quiet; then
            echo "Keine neuen Videos."
          else
            git commit -m "🕌 Auto-Update: Neue Videos [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
